  const ps = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - .5) * 90, y: H * .55, vx: (Math.random() - .5) * 15, vy: -Math.random() * 16 - 6,
    g: .38 + Math.random() * .2, w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: cols[(Math.random() * cols.length) | 0]

  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, W, H); f++; let alive = false;
    for (const p of ps) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
      if (p.y < H + 30) { alive = true; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - f / 150); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }

}

function diaryStreak() {

  let cur = 0, d = set.has(t) ? t : addDays(t, -1);
  while (set.has(d)) { cur++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  for (const x of arr) { run = prev && diffDays(x, prev) === 1 ? run + 1 : 1; if (run > best) best = run; prev = x; }
  return { cur, best, total: Object.values(db.diary).filter(hasText).length, todayDone: set.has(t) };
}

  const days = Object.keys(log).filter(k => log[k]).sort();
  let best = 0, run = 0, prev = null;

/* ───────── PIN lock ───────── */
function padHTML(len = 4) {
  return `<div class="dots" id="dots" aria-hidden="true">${Array.from({ length: len }, () => '<i></i>').join('')}</div>
    <div class="pad" role="group" aria-label="PIN pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}" aria-label="${n}">${n}</button>`).join('')}<button class="ghost" data-k="x" aria-label="Clear">Clear</button><button data-k="0" aria-label="0">0</button><button class="ghost" data-k="b" aria-label="Delete">${ic('chevL', 22)}</button></div>`;
}
function bindPad(root, onDone, len = 4) {
  let v = '';
  const dots = () => $$('#dots i', root).forEach((d, i) => d.classList.toggle('on', i < v.length));
  const onKey = k => {
    if (k === 'b') v = v.slice(0, -1); else if (k === 'x') v = ''; else if (v.length < len) v += k;
    buzz(5); dots();
    if (v.length === len) { const cur = v; setTimeout(async () => { const ok = await onDone(cur); if (ok === false) { const d = $('#dots', root); d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad'); buzz([30, 40, 30]); } v = ''; dots(); }, 120); }
  };
  root.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) onKey(b.dataset.k); });
  const kd = e => { if (!root.isConnected) return document.removeEventListener('keydown', kd); if (/^\d$/.test(e.key)) onKey(e.key); else if (e.key === 'Backspace') onKey('b'); };
  document.addEventListener('keydown', kd);
}
function openPinSetup(done) {
  let first = null;
  const rec = openSheet(`<div class="sheet-h"><h2>Set app lock</h2><button class="icon-btn sm" data-x aria-label="Close">${ic('close', 18)}</button></div><p class="dim center" id="pin-sub" style="margin-bottom:10px">Choose a 4-digit PIN</p><div style="display:flex;flex-direction:column;align-items:center;padding-bottom:10px">${padHTML()}</div>`);
  $('[data-x]', rec.el).onclick = () => closeSheet(rec);
  bindPad(rec.el, async pin => {
    if (!first) { first = pin; $('#pin-sub', rec.el).textContent = 'Enter it once more to confirm'; return true; }
    if (pin !== first) { first = null; $('#pin-sub', rec.el).textContent = 'Those did not match. Choose a PIN again'; return false; }
    db.settings.lockSalt = rnd(8); db.settings.lockPin = await sha(pin + db.settings.lockSalt); save(); closeSheet(rec);
    toast('App lock is on', { icon: '🔒', kind: 'good' }); done && done(); return true;
  });
}
let locked = false;
function showLock() {
  if (!db || !db.settings.lockPin || locked) return;
  locked = true;
  const el = $('#lock'); el.hidden = false;
  el.innerHTML = `<div class="brand-mark">L</div><h2>Enter your PIN</h2><p class="dim small" id="lock-sub">Lumo is locked</p>${padHTML()}<button class="textlink small" data-forgot>Forgot PIN? Log out</button>`;
  bindPad(el, async pin => {
    if ((await sha(pin + db.settings.lockSalt)) === db.settings.lockPin) { locked = false; el.hidden = true; el.innerHTML = ''; return true; }

}

}
function importBackup(file, rec) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || j.app !== 'lumo' || !j.data || !Array.isArray(j.data.tx)) throw new Error('bad');
      if (!(await confirmSheet({ title: 'Replace your data?', msg: `This backup has ${j.data.tx.length} money entries and ${Object.keys(j.data.diary || {}).length} diary pages. Your current data will be replaced.`, ok: 'Restore', danger: true }))) return;
      const keep = { lockPin: db.settings.lockPin, lockSalt: db.settings.lockSalt }, prof = { email: db.profile.email, phone: db.profile.phone };
      db = migrate(j.data); Object.assign(db.settings, keep); Object.assign(db.profile, prof);
      save(); flush(); applySettings(); closeSheet(rec); render(); toast('Backup restored', { icon: '✅', kind: 'good' });
    } catch (e) { toast('That file is not a Lumo backup', { kind: 'error' }); }
  };
  r.readAsText(file);
}
function exportCSV() {
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Date', 'Type', 'Category', 'Amount', 'Note', 'Paid with']].concat(db.tx.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t => [t.date, t.type, catInfo(t.type, t.cat).name, t.amt, t.note || '', t.method || '']));
  download(`lumo-money-${today()}.csv`, '﻿' + rows.map(r => r.map(cell).join(',')).join('\n'), 'text/csv');
  toast('CSV downloaded', { icon: '📄', kind: 'good' });
}
async function eraseData(rec) {
  if (!(await confirmSheet({ title: 'Erase all data?', msg: 'Money, diary, habits and the jar will be cleared. Your account stays. This cannot be undone.', ok: 'Erase everything', danger: true }))) return;
  const keep = { profile: db.profile, settings: db.settings };
  db = newDB({}); db.profile = keep.profile; db.settings = keep.settings; save(); flush(); closeSheet(rec); render(); toast('All data erased', { icon: '🧹' });
}
async function deleteAccount(rec) {
  if (!(await confirmSheet({ title: 'Delete your account?', msg: 'Your account and everything in it will be removed from this device. Export a backup first if you want to keep it.', ok: 'Delete account', danger: true }))) return;
  users = users.filter(u => u.id !== user.id); saveUsers(); Store.del(dbKey(user.id)); Store.del('lumo:session');
  closeAllSheets(); user = null; db = null; setTimeout(() => { showAuth(); toast('Account deleted', { icon: '🗑️' }); }, 100);
}
function logout() {
  flush(); Store.del('lumo:session'); closeAllSheets();
  user = null; db = null; locked = false; applySettings(); showAuth();
  toast('Logged out', { icon: '👋' });
}

/* ───────────────────────────────────────────────────────────
   Lumo · main: shell, router, actions, PWA plumbing, boot
   ─────────────────────────────────────────────────────────── */
const S = { tab: 'home', fresh: true };
const TABS = [['home', 'Home', 'home'], ['money', 'Money', 'wallet'], ['diary', 'Journal', 'book'], ['spark', 'Habits', 'check'], ['me', 'Profile', 'user']];
let deferredInstall = null, swReg = null, remTimer = null, hiddenAt = 0, lastDay = today();
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => safe(() => matchMedia('(display-mode: standalone)').matches, false) || navigator.standalone === true;

function buildNav() {
  $('#nav').innerHTML = '<i class="pill" aria-hidden="true"></i>' + TABS.map(([k, n, i]) => `<button data-nav="${k}" aria-label="${n}">${ic(i)}<span>${n}</span></button>`).join('');
}
function updateNav() {
  const i = TABS.findIndex(t => t[0] === S.tab);
  $('#nav .pill').style.transform = `translateX(${i * 100}%)`;
  $$('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === S.tab ? 'page' : 'false'));
}
const VIEWS = { home: () => viewHome(), money: () => viewMoney(), diary: () => viewDiary(), spark: () => viewSpark(), me: () => viewProfile() };
function render() {
  if (!db) return;
  const v = $('#view'), top = S.fresh ? 0 : v.scrollTop, fresh = S.fresh;
  v.innerHTML = VIEWS[S.tab]();
  if (!fresh) $$('.page-in', v).forEach(e => e.classList.remove('page-in'));
  v.scrollTop = top;
  countUps(v, fresh);
  if (S.tab === 'home') afterHome();
  if (S.tab === 'money' && M.seg === 'insights') afterInsights();
  M.still = false; S.fresh = false;
  updateNav();
}
function goTab(tab, seg) {
  if (seg === 'jar') H.seg = 'jar';
  closeAllSheets();
  S.tab = tab; S.fresh = true; render();
  $('#view').scrollTop = 0; buzz(5);
}

/* ───────── actions ───────── */
document.addEventListener('click', e => {
  const nav = e.target.closest('#nav [data-nav]');
  if (nav) return goTab(nav.dataset.nav);
  const b = e.target.closest('#shell [data-act]');
  if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a) {
    case 'go': return goTab(d.tab, d.seg);
    case 'install': return promptInstall();
    case 'set-budget-home': return openBudget();
    case 'install-dismiss': db.flags.installDismissed = 1; save(); return render();
    /* money */
    case 'tx-new': return openTx(null, { type: d.t });
    case 'tx-edit': return openTx(d.id);
    case 'toggle-search': M.search = !M.search; if (!M.search) M.q = ''; M.seg = 'activity'; render(); if (M.search) safe(() => $('#m-q').focus()); return;
    case 'filters': return openFilters();
    case 'range': M.range = d.r; M.off = 0; M.limit = 60; M.sel = null; if (d.r === 'custom') { if (!M.custom.from) return openCustomRange(); } return render();
    case 'range-custom': return openCustomRange();
    case 'period': M.off = Math.min(0, M.off + +d.d); M.sel = null; M.limit = 60; return render();
    case 'm-seg': M.seg = d.s; return render();
    case 'm-type': M.type = d.t; M.cats = M.cats.filter(id => M.type === 'all' || db.cats[M.type].some(c => c.id === id)); M.limit = 60; return render();
    case 'rm-cat': M.cats = M.cats.filter(x => x !== d.id); return render();
    case 'rm-method': M.methods = M.methods.filter(x => x !== d.m); return render();
    case 'clear-filters': M.cats = []; M.methods = []; M.q = ''; M.type = 'all'; M.sort = 'new'; M.search = false; return render();
    case 'more': M.limit += 60; return render();
    case 'set-budget': return openBudget();
    case 'metric': M.metric = d.k; M.still = true; return render();
    case 'donut-pick': M.sel = M.sel === d.id ? null : d.id; M.still = true; return render();
    case 'cat-filter': M.cats = [d.id]; M.type = 'expense'; M.seg = 'activity'; M.sel = null; return render();
    case 'bar': return pickBar(+d.i);
    case 'goal-new': return openGoal();
    case 'goal-edit': return openGoal(d.id);
    case 'goal-add': return openGoalAdd(d.id);
    /* diary */
    case 'diary-open': return openDiary(d.date);
    case 'diary-pick': return openDiaryPicker();
    case 'cal': { const [y, m] = D.month.split('-').map(Number), x = new Date(y, m - 1 + +d.d, 1), ym = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; if (ym <= today().slice(0, 7)) D.month = ym; return render(); }
    case 'd-more': D.limit += 30; $('#d-list').innerHTML = entryList(); return;
    /* spark */
    case 'h-seg': H.seg = d.s; return render();
    case 'habit-toggle': return toggleHabit(d.id, d.date);
    case 'habit-new': return openHabit();
    case 'habit-quick': return openHabit(null, { e: d.e, n: d.n });
    case 'habit-edit': return openHabit(d.id);
    case 'jar-add': return addJarNote();
    case 'jar-pull': return openPull();
    case 'jar-del': {
      const gone = db.jar.find(x => x.id === d.id); db.jar = db.jar.filter(x => x.id !== d.id); save(); render();
      return toast('Entry removed', { action: 'Undo', onAction: () => { db.jar.push(gone); save(); render(); } });
    }
    /* profile */
    case 'settings': return openSettings(d.sec);
    case 'edit-profile': return openEditProfile();
    case 'logout': return confirmSheet({ title: 'Log out?', msg: 'Your data stays on this device. Log back in any time.', ok: 'Log out' }).then(ok => { if (ok) logout(); });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'm-q') { M.q = e.target.value; M.limit = 60; $('#m-body').innerHTML = moneyBody(); }
  if (e.target.id === 'd-q') { D.q = e.target.value; D.limit = 30; $('#d-list').innerHTML = entryList(); }
});
function pickBar(i) {
  const el = $('#bar-data'); if (!el) return;
  const j = safe(() => JSON.parse(el.textContent), null); if (!j || j.v[i] == null) return;
  $('#bar-l').textContent = j.l[i]; $('#bar-v').textContent = money(j.v[i]);
  const svg = $('#bars'); if (!svg) return;
  svg.classList.add('has-sel');
  $$('path.b', svg).forEach(p => p.classList.toggle('sel', +p.dataset.i === i));
}
document.addEventListener('pointerover', e => { const r = e.target.closest && e.target.closest('rect.hit'); if (r && e.pointerType === 'mouse') pickBar(+r.dataset.i); });

/* ───────── session ───────── */
function showAuth() {
  $('#shell').hidden = true; $('#auth').hidden = false; $('#lock').hidden = true;
  A.screen = 'welcome'; A.ctx = {}; A.tab = 'pw';
  renderAuth('welcome');
}
function enterApp(u, isNew) {
  user = u;
  db = migrate(Store.get(dbKey(u.id), newDB({ name: u.name, email: u.email, phone: u.phone })));
  db.profile.name = db.profile.name || u.name; db.profile.email = u.email; db.profile.phone = u.phone;
  applySettings();
  $('#auth').hidden = true; $('#auth').innerHTML = ''; $('#shell').hidden = false;
  buildNav(); S.tab = 'home'; S.fresh = true;
  M.seg = 'activity'; M.type = 'all'; M.cats = []; M.methods = []; M.q = ''; M.search = false; M.range = 'month'; M.off = 0; M.sel = null;
  D.month = today().slice(0, 7); D.q = '';
  render(); checkBadges(); save(); flush();
  scheduleReminder();
  if (db.settings.lockPin && !isNew) showLock();
  if (isNew) { setTimeout(() => { toast(`Welcome to Lumo, ${db.profile.name.split(' ')[0]}`, { kind: 'good', ms: 4200 }); }, 500); }
  else setTimeout(nudgeOnOpen, 1400);
  handleShortcut();
}
function handleShortcut() {
  const a = new URLSearchParams(location.search).get('a'); if (!a) return;
  safe(() => history.replaceState({ lumoRoot: 1 }, '', location.pathname));
  setTimeout(() => { if (locked) return; if (a === 'expense') { goTab('money'); openTx(null, { type: 'expense' }); } else if (a === 'diary') { goTab('diary'); openDiary(today()); } }, 500);
}
function nudgeOnOpen() {
  if (!db || locked) return;
  const r = db.settings.reminder, now = new Date();
  if (!r.on || db.flags.nudged === today()) return;
  const [h, m] = r.time.split(':').map(Number);
  if ((now.getHours() * 60 + now.getMinutes()) >= h * 60 + m && !diaryStreak().todayDone) {
    db.flags.nudged = today(); save();
    toast('Today\'s journal entry is still empty.', { action: 'Write', ms: 7000, onAction: () => openDiary(today()) });
  }
}

/* ───────── reminders ───────── */
function scheduleReminder() {
  clearTimeout(remTimer);
  if (!db || !db.settings.reminder.on) return;
  const [h, m] = db.settings.reminder.time.split(':').map(Number), now = new Date(), at = new Date(now);
  at.setHours(h, m, 0, 0); if (at <= now) at.setDate(at.getDate() + 1);
  remTimer = setTimeout(() => { fireReminder(); scheduleReminder(); }, at - now);
}
function fireReminder() {
  if (!db || diaryStreak().todayDone) return;
  const msg = 'Today\'s journal entry is still empty. A short entry keeps your streak going.';
  if ('Notification' in window && Notification.permission === 'granted') {
    safe(() => {
      if (swReg && swReg.showNotification) swReg.showNotification('Lumo', { body: msg, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'lumo-reminder' });
      else new Notification('Lumo', { body: msg });
    });
  } else toast(msg, { icon: '📖', action: 'Write', ms: 7000, onAction: () => openDiary(today()) });
}

/* ───────── PWA: install, offline, updates ───────── */
window.addEventListener('beforeinstallprompt', e => { if (NATIVE) return; e.preventDefault(); deferredInstall = e; if (db && S.tab === 'home') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Lumo installed', { icon: '📲', kind: 'good' }); if (db) render(); });
async function promptInstall() {
  if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; if (db) render(); return; }
  if (isStandalone()) return toast('Lumo is already installed', { icon: '✅' });
  if (isIOS()) {
    const rec = openSheet(`<div class="sheet-h"><h2>Install on iPhone</h2><button class="icon-btn sm" data-x aria-label="Close">${ic('close', 18)}</button></div>
      <ol class="col dim" style="padding-left:20px;gap:10px"><li>Open Lumo in <b>Safari</b></li><li>Tap the <b>Share</b> button</li><li>Choose <b>Add to Home Screen</b></li></ol>
      <div class="sheet-foot"><button class="btn block" data-x>Got it</button></div>`);
    $$('[data-x]', rec.el).forEach(x => x.onclick = () => closeSheet(rec));
    return;
  }
  toast('Open your browser menu and choose "Install app" or "Add to Home screen".', { icon: '📲', ms: 5000 });
}
function registerSW() {
  if (NATIVE || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg;
    if (reg.waiting && had) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw); });
    });
  }).catch(() => { /* offline support unavailable */ });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloading) return; reloading = true; flush(); location.reload(); });
}
function offerUpdate(w) { toast('A new version of Lumo is ready', { icon: '✨', action: 'Update', ms: 14000, onAction: () => w.postMessage('SKIP_WAITING') }); }
function checkUpdate() {
  if (!swReg) return toast('Updates are checked automatically once Lumo is served over HTTPS.', { icon: 'ℹ️', ms: 4500 });
  swReg.update().then(() => { if (swReg.waiting) offerUpdate(swReg.waiting); else toast('You are on the latest version', { icon: '✅', kind: 'good' }); }).catch(() => toast('Could not check for updates', { kind: 'error' }));
}
window.addEventListener('offline', () => toast('You are offline. Lumo keeps working.', { icon: '📡' }));
window.addEventListener('online', () => toast('Back online', { icon: '✅', kind: 'good' }));

/* ───────── lifecycle ───────── */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!db) return;
  if (db.settings.lockPin && hiddenAt && Date.now() - hiddenAt > CONFIG.LOCK_AFTER_MS) showLock();
  if (today() !== lastDay) { lastDay = today(); D.month = today().slice(0, 7); render(); }
});
setInterval(() => { if (db && !document.hidden && today() !== lastDay) { lastDay = today(); D.month = today().slice(0, 7); render(); } }, 60000);

/* ───────── boot ───────── */
function boot() {
  applySettings();
  safe(() => history.replaceState({ lumoRoot: 1 }, ''));
  const sess = Store.get('lumo:session'), u = sess && users.find(x => x.id === sess.id);
  try { if (u) enterApp(u); else showAuth(); } catch (err) { console.error(err); Store.del('lumo:session'); showAuth(); }
  setTimeout(() => { const sp = $('#splash'); sp.classList.add('gone'); setTimeout(() => sp.remove(), 700); }, 250);
  registerSW();
  if (navigator.storage && navigator.storage.persist) safe(() => navigator.storage.persist());
}
boot();

})();</script>
